[project]
name = "dkb-parser"
version = "0.1.0"
description = "Parse DKB monthly bank statement PDFs into pandas DataFrames"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jpype1==1.5.2",
    "pandas>=2.0",
    "pdfminer.six>=20221105",
    "tabula-py>=2.9.3",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "joblib>=1.3.0",
    "tqdm-joblib>=0.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
